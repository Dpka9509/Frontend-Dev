<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="text-center fw-bold mb-4">User Notifications</h2>

    <!-- Card for alerts -->
    <div class="card p-4 shadow-sm mb-4">
      <!-- Success Alert -->
      <div class="alert alert-success" role="alert">
        ✅ You have 3 new messages!
      </div>

      <!-- Info Alert (dismissible) -->
      <div class="alert alert-info alert-dismissible fade show" role="alert">
        ℹ️ Tip: Check out the new dashboard features.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <!-- Danger Alert -->
      <div class="alert alert-danger" role="alert">
        ⚠️ Warning: Your subscription will expire in 3 days.
      </div>
    </div>

    <!-- Summary Well -->
    <div class="bg-light border p-4 shadow-sm">
      <h5 class="fw-bold mb-3">Summary</h5>
      <p>Total Notifications: 7</p>
      <p>Unread Messages: 3</p>
      <p>System Alerts: 2</p>
      <p>Tips & Updates: 2</p>
    </div>

  </div>

  <!-- Bootstrap JS (for dismissible alerts) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
