<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations Showcase</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      gap: 30px;
      text-align: center;
    }

    .box {
      width: 120px;
      height: 120px;
      background: #1a73e8;
      border-radius: 10px;
      transition: all 0.4s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      font-size: 1rem;
    }

    .rotate:hover {
      transform: rotate(25deg);
    }

    .scale:hover {
      transform: scale(1.3);
    }

    .translate:hover {
      transform: translate(20px, -20px);
    }

    .skew:hover {
      transform: skew(15deg, 5deg);
    }

    p.label {
      margin-top: 8px;
      font-size: 0.95rem;
      color: #333;
    }

  </style>

</head>
<body>

  <div class="container">

    <div>
      <div class="box rotate">Rotate</div>
      <p class="label">transform: rotate()</p>
    </div>

    <div>
      <div class="box scale">Scale</div>
      <p class="label">transform: scale()</p>
    </div>

    <div>
      <div class="box translate">Translate</div>
      <p class="label">transform: translate()</p>
    </div>

    <div>
      <div class="box skew">Skew</div>
      <p class="label">transform: skew()</p>
    </div>

  </div>

</body>
</html>
