<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f2f2f2;
        }

        .gallery {
            display: grid;
            gap: 15px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        .gallery-item {
            text-align: center;
        }

        .gallery-item img {
            width: 100%;
            display: block;
            border-radius: 8px;
            transition: filter 0.4s ease;
        }

        /* Filters */
        .blur img { filter: blur(3px); }
        .grayscale img { filter: grayscale(100%); }
        .sepia img { filter: sepia(100%); }
        .brightness img { filter: brightness(60%); }
        .contrast img { filter: contrast(200%); }
        .hue img { filter: hue-rotate(90deg); }

        /* Hover removes filter */
        .gallery-item img:hover {
            filter: none;
        }

        /* Caption */
        .caption {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Single column on small screens */
        @media(max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h2>Responsive Image Filter Gallery</h2>

    <div class="gallery">
        <div class="gallery-item blur">
            <img src="https://picsum.photos/300?1" alt="">
            <div class="caption">Blur</div>
        </div>

        <div class="gallery-item grayscale">
            <img src="https://picsum.photos/300?2" alt="">
            <div class="caption">Grayscale</div>
        </div>

        <div class="gallery-item sepia">
            <img src="https://picsum.photos/300?3" alt="">
            <div class="caption">Sepia</div>
        </div>

        <div class="gallery-item brightness">
            <img src="https://picsum.photos/300?4" alt="">
            <div class="caption">Brightness</div>
        </div>

        <div class="gallery-item contrast">
            <img src="https://picsum.photos/300?5" alt="">
            <div class="caption">Contrast</div>
        </div>

        <div class="gallery-item hue">
            <img src="https://picsum.photos/300?6" alt="">
            <div class="caption">Hue Rotate</div>
        </div>
    </div>

</body>
</html>
