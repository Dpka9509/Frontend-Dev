<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pseudo-Classes Demonstration</title>

<style>
  body{
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    padding: 40px;
  }

  h1{
    text-align: center;
    margin-bottom: 40px;
  }

  .container{
    display: flex;
    justify-content: center;
    gap: 40px;
  }

  .example-box{
    background: white;
    padding: 20px;
    width: 230px;
    border-radius: 10px;
    border: 1px solid #ccc;
  }

  .example-box h2{
    font-size: 18px;
    margin-bottom: 12px;
    color: #333;
  }

  a.hover-link{
    padding: 8px 14px;
    display: inline-block;
    color: white;
    background: #2563eb;
    border-radius: 6px;
    text-decoration: none;
    transition: 0.3s;
  }
  a.hover-link:hover{
    background: #1e40af;
  }


  input:focus{
    border: 2px solid #22c55e;
    outline: none;
    background: #eaffea;
  }


  button:active{
    background: #dc2626;
    color: white;
  }

  button{
    padding: 8px 16px;
    border: none;
    cursor: pointer;
    background: #ef4444;
    border-radius: 6px;
    color: white;
    transition: 0.3s;
  }

  ul li:nth-child(odd){
    background: #dbeafe;
  }
  ul li:nth-child(even){
    background: #fde68a;
  }

  ul{
    padding: 0;
    margin-top: 12px;
  }
  ul li{
    list-style: none;
    padding: 6px;
    border-radius: 4px;
    margin-bottom: 4px;
  }
</style>

</head>
<body>

<h1>Pseudo-Class Demonstration</h1>

<div class="container">

  <div class="example-box">
    <h2>:hover</h2>
    <p>Hover over the link below:</p>
    <a href="#" class="hover-link">Hover Me</a>
  </div>

  <div class="example-box">
    <h2>:focus</h2>
    <p>Click inside the input:</p>
    <input type="text" placeholder="Click to Focus">
  </div>

  <div class="example-box">
    <h2>:active</h2>
    <p>Press and hold the button:</p>
    <button>Click Me</button>
  </div>

  <div class="example-box">
    <h2>:nth-child()</h2>
    <p>Odd and Even list items styled differently:</p>
    <ul>
      <li>Item One</li>
      <li>Item Two</li>
      <li>Item Three</li>
      <li>Item Four</li>
    </ul>
  </div>

</div>

</body>
</html>
