<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Smooth hover effect for cards */
    .product-card {
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="text-center fw-bold mb-5">Our Products</h2>
    
    <div class="row g-4">
      
      <!-- Product 1 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm h-100 text-center p-3">
          <img src="https://via.placeholder.com/200" class="card-img-top img-fluid mb-3" alt="Product 1">
          <h5 class="card-title">Product 1</h5>
          <p class="card-text text-primary fw-bold">$25.00</p>
          <button class="btn btn-primary w-100">Add to Cart</button>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm h-100 text-center p-3">
          <img src="https://via.placeholder.com/200" class="card-img-top img-fluid mb-3" alt="Product 2">
          <h5 class="card-title">Product 2</h5>
          <p class="card-text text-primary fw-bold">$30.00</p>
          <button class="btn btn-primary w-100">Add to Cart</button>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm h-100 text-center p-3">
          <img src="https://via.placeholder.com/200" class="card-img-top img-fluid mb-3" alt="Product 3">
          <h5 class="card-title">Product 3</h5>
          <p class="card-text text-primary fw-bold">$40.00</p>
          <button class="btn btn-primary w-100">Add to Cart</button>
        </div>
      </div>

      <!-- Product 4 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm h-100 text-center p-3">
          <img src="https://via.placeholder.com/200" class="card-img-top img-fluid mb-3" alt="Product 4">
          <h5 class="card-title">Product 4</h5>
          <p class="card-text text-primary fw-bold">$50.00</p>
          <button class="btn btn-primary w-100">Add to Cart</button>
        </div>
      </div>

      <!-- Add more products here as needed -->

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
