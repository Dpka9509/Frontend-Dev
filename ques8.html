<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filter Comparison Layout</title>

<style>
    body {
        margin: 0;
        padding: 30px;
        background: #f4f4f4;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .comparison-container {
        display: flex;
        gap: 20px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
    }

    .image-box {
        flex: 1 1 300px;
        max-width: 450px;
    }

    .image-box img {
        width: 100%;
        border-radius: 10px;
        transition: filter 0.4s ease;
    }

    /* Apply filter to the after image */
    .after img {
        filter: brightness(60%);
    }

    /* Hover removes filter */
    .after img:hover {
        filter: none;
    }

    .caption {
        margin-top: 8px;
        font-weight: 600;
        font-size: 16px;
    }

    /* Stack images vertically below 700px */
    @media(max-width: 700px) {
        .comparison-container {
            flex-direction: column;
        }
    }
</style>
</head>
<body>

<h2>Before & After Filter Comparison</h2>

<div class="comparison-container">
    <div class="image-box before">
        <img src="https://picsum.photos/500?random=1" alt="">
        <div class="caption">Before</div>
    </div>

    <div class="image-box after">
        <img src="https://picsum.photos/500?random=1" alt="">
        <div class="caption">After (Brightness Reduced)</div>
    </div>
</div>

</body>
</html>
