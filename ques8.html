<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Plans</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Hover effect for cards */
    .pricing-card {
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .pricing-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="text-center fw-bold mb-5">Choose Your Plan</h2>
    
    <div class="row g-4">
      
      <!-- Basic Plan -->
      <div class="col-12 col-md-4">
        <div class="card pricing-card h-100 text-center p-4 shadow-sm">
          <h5 class="card-title fw-bold mb-3">Basic</h5>
          <p class="fs-3 fw-bold mb-3">$9<span class="fs-6">/mo</span></p>
          <ul class="list-group list-group-flush mb-3">
            <li class="list-group-item">5 Projects</li>
            <li class="list-group-item">10 GB Storage</li>
            <li class="list-group-item">Basic Support</li>
          </ul>
          <a href="#" class="btn btn-outline-primary w-100">Get Started</a>
        </div>
      </div>

      <!-- Pro Plan (Highlighted) -->
      <div class="col-12 col-md-4">
        <div class="card pricing-card h-100 text-center p-4 shadow-lg bg-primary text-white">
          <h5 class="card-title fw-bold mb-3">Pro</h5>
          <p class="fs-3 fw-bold mb-3">$29<span class="fs-6">/mo</span></p>
          <ul class="list-group list-group-flush mb-3">
            <li class="list-group-item bg-primary text-white">50 Projects</li>
            <li class="list-group-item bg-primary text-white">100 GB Storage</li>
            <li class="list-group-item bg-primary text-white">Priority Support</li>
          </ul>
          <a href="#" class="btn btn-light w-100">Get Started</a>
        </div>
      </div>

      <!-- Enterprise Plan -->
      <div class="col-12 col-md-4">
        <div class="card pricing-card h-100 text-center p-4 shadow-sm">
          <h5 class="card-title fw-bold mb-3">Enterprise</h5>
          <p class="fs-3 fw-bold mb-3">$99<span class="fs-6">/mo</span></p>
          <ul class="list-group list-group-flush mb-3">
            <li class="list-group-item">Unlimited Projects</li>
            <li class="list-group-item">1 TB Storage</li>
            <li class="list-group-item">Dedicated Support</li>
          </ul>
          <a href="#" class="btn btn-outline-primary w-100">Get Started</a>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
