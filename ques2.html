<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Flexbox Layout</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f4f4f4;
        }

        /* Header */
        header {
            background: #333;
            color: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo {
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            color: #fff;
            margin-left: 20px;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Main Feature Section */
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px 20px;
        }

        .feature-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
            transition: transform 0.3s ease;
        }

        .feature-box:hover {
            transform: scale(1.05);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            background: #333;
            color: white;
            margin-top: 40px;
        }

        /* Responsive for below 750px */
        @media (max-width: 750px) {
            .features {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MyWebsite</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="features">
            <div class="feature-box">Feature Box 1</div>
            <div class="feature-box">Feature Box 2</div>
            <div class="feature-box">Feature Box 3</div>
        </section>
    </main>

    <footer>
        &copy; 2025 MyWebsite. All Rights Reserved.
    </footer>

</body>
</html>
