<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">
  <div class="container text-center p-5 mt-4">
    <h1 class="fw-bold mb-3">Dèëpíkà Srivastav</h1>
    <p class="mb-4">Aspiring Frontend Developer | Web Enthusiast</p>
    <img src="https://via.placeholder.com/150" 
         alt="Profile Image" 
         class="img-fluid rounded-circle mb-4">
    <div class="mb-4">
      <a href="#" class="btn btn-primary me-2">Hire Me</a>
      <a href="#" class="btn btn-secondary">Download CV</a>
    </div>
    <form class="w-50 mx-auto">
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Your Name">
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Your Email">
      </div>
      <div class="mb-3">
        <textarea class="form-control" rows="3" placeholder="Your Message"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
