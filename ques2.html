<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip Demonstration</title>

<style>
    body{
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f3f3;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
    }

    h1{
        margin-bottom: 40px;
    }

    .tooltip-container{
        display: flex;
        gap: 40px;
    }

    .tooltip{
        position: relative;
        display: inline-block;
        cursor: pointer;
        padding: 12px 18px;
        background: #2563eb;
        color: white;
        border-radius: 6px;
        font-size: 16px;
    }

    /* Tooltip Text Hidden Default */
    .tooltip span{
        visibility: hidden;
        opacity: 0;
        position: absolute;
        background: #111;
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 14px;
        bottom: 130%; /* move above element */
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        transition: opacity 0.3s ease-in-out;
    }

    /* Tooltip Arrow */
    .tooltip span::after{
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border-width: 6px;
        border-style: solid;
        border-color: #111 transparent transparent transparent;
    }

    /* Show Tooltip on Hover */
    .tooltip:hover span{
        visibility: visible;
        opacity: 1;
    }

</style>
</head>
<body>

<h1>CSS Tooltip Demonstration</h1>

<div class="tooltip-container">

    <div class="tooltip">
        Hover Me
        <span>This is a basic tooltip</span>
    </div>

    <div class="tooltip">
        Info
        <span>Useful information appears here</span>
    </div>

    <div class="tooltip">
        ?
        <span>This could be a help tooltip</span>
    </div>

</div>

</body>
</html>
