<!DOCTYPE html>
<html lang="en">
<head><title>Course Registration</title></head>
<body>
  <h1>Course Registration Form</h1>
  <form>
    <fieldset>
      <legend>Student Information</legend>
      <label>Name: <input type="text" name="studentName"></label><br>
      <label>Email: <input type="email" name="studentEmail"></label><br>
      <label>Select Course:
        <select>
          <option selected>Web Development</option>
          <option>Data Science</option>
          <option>AI Basics</option>
        </select>
      </label>
    </fieldset>

    <h2>Available Schedules</h2>
    <table border="1">
      <tr><th>Day</th><th>Time</th><th>Instructor</th></tr>
      <tr><td>Monday</td><td>10 AM</td><td>Mr. Smith</td></tr>
      <tr><td>Friday</td><td>2 PM</td><td>Ms. Taylor</td></tr>
    </table>
  </form>
</body>
</html>
