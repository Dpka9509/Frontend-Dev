<!DOCTYPE html>
<html lang="en">
<head>
  <title>Selection Page</title>
</head>
<body>
  <h1>Select Your Preferences</h1>
  <form>
    <label>Country:
      <select>
        <option selected>India</option>
        <option>USA</option>
        <option>Japan</option>
      </select>
    </label><br><br>
    <label>State:
      <select>
        <option>California</option>
        <option selected>Maharashtra</option>
        <option>Tokyo</option>
      </select>
    </label><br><br>
    <label>City:
      <select>
        <option>San Francisco</option>
        <option selected>Mumbai</option>
        <option>Shibuya</option>
      </select>
    </label><br><br>
    <label>Favorite Tourist Place:
      <select>
        <option>Taj Mahal</option>
        <option selected>Gateway of India</option>
        <option>Mount Fuji</option>
      </select>
    </label>
  </form>
  <p>Your selected country is India, state is Maharashtra, city is Mumbai, and favorite place is Gateway of India.</p>
</body>
</html>
