<!DOCTYPE html>
<html lang="en">
<head>
  <title>Conference Schedule</title>
</head>
<body>
  <header>
    <h1>Annual Tech Conference 2025</h1>
  </header>
  <main>
    <table border="1">
      <caption>Conference Schedule</caption>
      <thead>
        <tr>
          <th>Session</th><th>Time</th><th>Topic</th><th>Speaker</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td rowspan="2">Morning</td>
          <td>09:00 AM</td><td>Opening Keynote</td><td>Jane Doe</td>
        </tr>
        <tr>
          <td>10:30 AM</td><td>Web Trends</td><td>John Smith</td>
        </tr>
        <tr>
          <td>Afternoon</td>
          <td>01:00 PM</td><td>AI in 2025</td><td>Lisa Ray</td>
        </tr>
        <tr>
          <td>Evening</td>
          <td>04:00 PM</td><td>Panel Discussion</td><td>Various</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="4">End of Schedule</td>
        </tr>
      </tfoot>
    </table>
  </main>
</body>
</html>
