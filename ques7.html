<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <!-- Header with Pending Tasks Badge -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold">Task Tracker</h2>
      <span class="badge bg-primary fs-6">Pending: 5</span>
    </div>

    <!-- Task List -->
    <ul class="list-group mb-4">
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Design Landing Page
        <span class="badge bg-danger">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Write Blog Post
        <span class="badge bg-warning text-dark">Medium</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Fix Bugs in App
        <span class="badge bg-danger">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Update Documentation
        <span class="badge bg-success">Low</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Team Meeting Preparation
        <span class="badge bg-warning text-dark">Medium</span>
      </li>
    </ul>

    <!-- Completed Tasks Button with Badge -->
    <button type="button" class="btn btn-success">
      Completed <span class="badge bg-light text-dark ms-2">2</span>
    </button>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
