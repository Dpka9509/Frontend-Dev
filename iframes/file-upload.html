<!-- file-upload.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload Form</title>
</head>
<body>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="fileUpload">Upload your image:</label><br>
        <input type="file" id="fileUpload" name="fileUpload" accept=".jpg,.jpeg,.png" required><br><br>

        <p>Allowed file types: JPEG (.jpg, .jpeg) and PNG (.png) images only.</p>

        <input type="submit" value="Upload">
    </form>
</body>
</html>
