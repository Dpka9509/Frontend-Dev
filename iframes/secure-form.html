<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Form Example</title>
</head>
<body>
    <form action="#" method="post" autocomplete="off">
        <label for="field1">Field 1:</label><br>
        <input type="text" id="field1" name="field1" required><br><br>

        <label for="field2">Field 2:</label><br>
        <input type="text" id="field2" name="field2" required><br><br>

        <input type="submit" value="Submit">
    </form>
    <p><em>Turning off autocomplete can improve security by preventing browsers from storing or automatically filling sensitive information.</em></p>
</body>
</html>
