<!-- google-map.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map Embed</title>
</head>
<body>
    <!-- Google map showing a city embed -->
    <!-- loading="lazy" defers loading of iframe until needed to improve performance -->
    <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.0867993558498!2d144.96305831531558!3d-37.8141079797516!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf577d9d205225d40!2sMelbourne%20VIC%2C%20Australia!5e0!3m2!1sen!2sin!4v1600000000000!5m2!1sen!2sin" 
        width="600" height="450" 
        title="Map showing Melbourne city" 
        loading="lazy" 
        style="border:0;" 
        allowfullscreen="" 
        aria-hidden="false" 
        tabindex="0">
    </iframe>
</body>
</html>
