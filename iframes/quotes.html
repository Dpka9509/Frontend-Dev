<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotes Example</title>
</head>
<body>
    <blockquote>
        This is a long quotation block. It can span multiple lines and paragraphs, providing emphasis to longer excerpts in the content.
    </blockquote>
    <p>
        He said, <q>Keep calm &amp; carry on</q> during the difficult times.
    </p>
</body>
</html>
