<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Form</title>
</head>
<body>
    <form action="#" method="post">
        <label for="cardholder">Cardholder Name:</label><br>
        <input type="text" id="cardholder" name="cardholder" required><br><br>

        <label for="cardnumber">Card Number:</label><br>
        <input type="text" id="cardnumber" name="cardnumber" pattern="[0-9\s]{13,19}" required placeholder="Enter card number"><br><br>

        <label for="expiry">Expiry Date:</label><br>
        <input type="month" id="expiry" name="expiry" required><br><br>

        <label for="cvv">CVV:</label><br>
        <input type="password" id="cvv" name="cvv" pattern="[0-9]{3,4}" required placeholder="3 or 4 digit code"><br><br>

        <input type="submit" value="Pay Now">
    </form>
</body>
</html>
