<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Styled Button Collection</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .button-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Base Button Style */
    button {
      padding: 12px 22px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    /* Primary Button */
    .btn-primary {
      background: #0066ff;
      color: white;
    }
    .btn-primary:hover { background: #0053cc; }
    .btn-primary:active { background: #003d99; }

    /* Secondary Button */
    .btn-secondary {
      background: #6366f1;
      color: white;
    }
    .btn-secondary:hover { background: #4f51d4; }

    /* Outline Button */
    .btn-outline {
      background: none;
      color: #333;
      border: 2px solid #333;
      box-shadow: none;
    }
    .btn-outline:hover {
      background: #333;
      color: white;
    }

    /* Focus Effect */
    button:focus {
      outline: 3px solid #ffb703;
      outline-offset: 3px;
    }

    /* Disabled Button */
    .btn-disabled {
      background: #ccc;
      color: #7a7a7a;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-disabled:hover,
    .btn-disabled:active {
      background: #ccc;
    }

  </style>

</head>
<body>

  <div class="button-container">
    <button class="btn-primary">Primary Button</button>
    <button class="btn-secondary">Secondary Button</button>
    <button class="btn-outline">Outline Button</button>
    <button class="btn-disabled" disabled>Disabled Button</button>
  </div>

</body>
</html>
